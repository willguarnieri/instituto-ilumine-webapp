<div class="go-back">
    <a [routerLink]="['']"><span class="material-icons mr-5">west</span> Voltar</a>
</div>
  <div class="signup grid grid-cols-1 xl:grid-cols-2">
    <div class="signup-content mx-4">
      <div class="mt-28 mb-28 flex justify-center">
        <form [formGroup]="loginForm">          
          <h3 class="font-bold text-4xl mb-10">Acesse sua conta</h3>

          <div class="bg-red-100 border border-red-100 text-red-700 px-4 py-3 rounded relative mb-6" role="alert" *ngIf="showError">
            <span class="block">Ocorreu um problema ao fazer login. </span>
            <span class="block">Verifique seu e-mail e senha ou crie uma conta.</span>
          </div>
          
          <div class="signup-input floating-placeholder mb-6">
            <input type="text" class="w-full" formControlName="email" placeholder=" " [ngClass]="{'field-error': email.touched && (email.hasError('required') || email.hasError('email'))}" />
            <label for="email" [ngClass]="{'text-red-700': email.touched && (email.hasError('required') || email.hasError('email'))}">Endereço de e-mail</label>
            <div class="feedback-text ml-6 mt-2.5"></div>
          </div>
            
          <div class="signup-input floating-placeholder mb-6">
            <input [type]="showPassword ? 'text' : 'password'" class="w-full" formControlName="password" placeholder=" " [ngClass]="{'field-error': password.touched && password.hasError('required')}"/>
            <label for="password" [ngClass]="{'text-red-700': password.touched && password.hasError('required')}">Digite sua senha</label>
            <div class="feedback-text ml-6 mt-2.5"></div>

            <div class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5">

              <svg class="h-6 block" fill="none" (click)="showPassword = !showPassword" [ngClass]="{'hidden': !showPassword, 'block':showPassword }" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512">
                <path fill="#424242" d="M572.52 241.4C518.29 135.59 410.93 64 288 64S57.68 135.64 3.48 241.41a32.35 32.35 0 0 0 0 29.19C57.71 376.41 165.07 448 288 448s230.32-71.64 284.52-177.41a32.35 32.35 0 0 0 0-29.19zM288 400a144 144 0 1 1 144-144 143.93 143.93 0 0 1-144 144zm0-240a95.31 95.31 0 0 0-25.31 3.79 47.85 47.85 0 0 1-66.9 66.9A95.78 95.78 0 1 0 288 160z">
                </path>
              </svg>

              <svg class="h-6 hidden" fill="none" (click)="showPassword = !showPassword" [ngClass]="{'block': !showPassword, 'hidden':showPassword }" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512">
                <path fill="#424242" d="M320 400c-75.85 0-137.25-58.71-142.9-133.11L72.2 185.82c-13.79 17.3-26.48 35.59-36.72 55.59a32.35 32.35 0 0 0 0 29.19C89.71 376.41 197.07 448 320 448c26.91 0 52.87-4 77.89-10.46L346 397.39a144.13 144.13 0 0 1-26 2.61zm313.82 58.1l-110.55-85.44a331.25 331.25 0 0 0 81.25-102.07 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64a308.15 308.15 0 0 0-147.32 37.7L45.46 3.37A16 16 0 0 0 23 6.18L3.37 31.45A16 16 0 0 0 6.18 53.9l588.36 454.73a16 16 0 0 0 22.46-2.81l19.64-25.27a16 16 0 0 0-2.82-22.45zm-183.72-142l-39.3-30.38A94.75 94.75 0 0 0 416 256a94.76 94.76 0 0 0-121.31-92.21A47.65 47.65 0 0 1 304 192a46.64 46.64 0 0 1-1.54 10l-73.61-56.89A142.31 142.31 0 0 1 320 112a143.92 143.92 0 0 1 144 144c0 21.63-5.29 41.79-13.9 60.11z">
                </path>
              </svg>

            </div>
          </div>
          <div class="signup-button mb-6">
            <button class="btn-green" (click)="login()">ACESSAR AGORA!</button>
          </div>
          <div class="signup-subject text-sm mb-6">
            <a [routerLink]="['/lembrar-senha']" class="right"> Esqueci minha senha</a>
          </div>
          <div class="signup-subject">
            Não tem uma conta?
            <a [routerLink]="['/cadastre-se']"> Cadastre-se</a>            
          </div>
          
        </form>
      </div>
    </div>
    <div class="signup-image relative hidden xl:block">
      <div class="d-none badge">
        <img src="/assets/images/badge.png">
      </div>
    </div>
  </div>
